<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.2em;
        }
        th, td{
            border: 2px solid black;
            padding: 3px;
            width: 80px;
        }
        .nota{
            text-align: center;
        }
        .areas{
            width: 120px;
            text-align: center;
            font-weight: bold;
        }
        .materias{
            width: 180px;
        }
        .media{
            font-weight: bold;
        }

    </style>
</head>
<body>
    <h1>Desafio 02 - Tabelas</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2" class="areas">Área</th>
                <th rowspan="2" class="materias">Matérias</th>
                <th colspan="2">Notas</th>
            
                <th rowspan="2">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="5" class="areas">Exatas</td>
            </tr>
            <tr>
                <td class="materias">Matemática</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>
            <tr>
                <td colspan="4" class="media">Média Exatas</td>
                <td class="nota" class="media">0.0</td>
            </tr>
            <tr>
                <td rowspan="3" class="areas">Humanas</td>
            </tr>
            <tr>
                <td>Sociologia</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>
            <tr>
                <td>História</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>
            <tr>
                <td colspan="4" class="media">Média Humanas</td>
                <td class="nota" class="media">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
